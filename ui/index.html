<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sharkyydrop</title>
<link rel="stylesheet" href="style.css">
<script>
try {
  var savedTheme = localStorage.getItem("sharkyydrop-theme");
  document.documentElement.dataset.theme = savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
} catch (e) {
  document.documentElement.dataset.theme = "light";
}
</script>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="mark">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#18A79F"/>
                <stop offset="1" stop-color="#065E5B"/>
              </linearGradient>
              <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#F3C994"/>
                <stop offset="1" stop-color="#DDA265"/>
              </linearGradient>
            </defs>
          
            <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
          
            <g transform="translate(512 512) scale(1.06) translate(-512 -512)">
          
            <g fill="#EAF6F4" opacity=".20">
              <circle cx="762" cy="248" r="20"/>
              <circle cx="808" cy="300" r="11"/>
              <circle cx="730" cy="194" r="8"/>
            </g>
          
            <g stroke="#0B2B2A" stroke-width="20" stroke-linejoin="round">
              <rect x="248" y="596" width="528" height="96" rx="42" fill="#073B39"/>
            </g>
          
            <path d="M512 620 C372 620 326 520 336 432 C348 340 414 276 512 276 C610 276 676 340 688 432 C698 520 652 620 512 620 Z"
                  fill="#54C5BC" stroke="#0B2B2A" stroke-width="22" stroke-linejoin="round"/>
          
            <path d="M366 468 C430 446 594 446 658 468 C650 548 596 606 512 618 C428 606 374 548 366 468 Z"
                  fill="#F8EFDD"/>
          
            <g fill="#F8EFDD" stroke="#0B2B2A" stroke-width="18">
              <circle cx="432" cy="410" r="58"/>
              <circle cx="592" cy="410" r="58"/>
            </g>
            <circle cx="444" cy="424" r="24" fill="#0B2B2A"/>
            <circle cx="604" cy="424" r="24" fill="#0B2B2A"/>
            <circle cx="436" cy="414" r="8" fill="#F8EFDD"/>
            <circle cx="596" cy="414" r="8" fill="#F8EFDD"/>
            <ellipse cx="490" cy="472" rx="7" ry="5" fill="#0B2B2A"/>
            <ellipse cx="534" cy="472" rx="7" ry="5" fill="#0B2B2A"/>
          
            <path d="M386 500 C450 548 574 548 638 500 C612 592 412 592 386 500 Z" fill="#0B2B2A"/>
            <g fill="#F8EFDD">
              <path d="M420 508 L466 508 L443 552 Z"/>
              <path d="M490 520 L534 520 L512 562 Z"/>
              <path d="M558 508 L604 508 L581 552 Z"/>
            </g>
          
            <rect x="212" y="618" width="600" height="66" rx="22" fill="#F2C68E" stroke="#0B2B2A" stroke-width="22"/>
            <path d="M238 678 H786 V848 Q786 888 746 888 H278 Q238 888 238 848 Z"
                  fill="url(#box)" stroke="#0B2B2A" stroke-width="22" stroke-linejoin="round"/>
          
            <path d="M410 706 V842" stroke="#C9884E" stroke-width="9" stroke-linecap="round" opacity=".55"/>
            <path d="M614 706 V842" stroke="#C9884E" stroke-width="9" stroke-linecap="round" opacity=".55"/>
            <rect x="450" y="756" width="124" height="74" rx="12" fill="#FBF3E2" stroke="#0B2B2A" stroke-width="14"/>
            <path d="M480 808 Q496 782 512 800 Q528 780 544 808" fill="none" stroke="#0B7A75" stroke-width="12" stroke-linecap="round"/>
            </g>
          </svg>
      </div>
      <div>
        <div class="brand-name">Sharkyydrop</div>
        <div class="brand-sub">AirDrop для всех</div>
      </div>
    </div>
    <div class="status" id="status">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">запускаюсь…</span>
    </div>
    <button class="theme-btn" id="themeBtn" title="Сменить тему" aria-label="Сменить тему">
      <svg class="i-moon" viewBox="0 0 24 24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="ghost" id="openDir">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h6l2 2h10v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7z"/></svg>
      Папка загрузок
    </button>
  </header>

  <main class="grid">
    <aside class="panel qr-panel">
      <div class="panel-title">Подключи телефон</div>
      <div class="qr-box" id="qrBox"><div class="qr-load">генерирую код…</div></div>
      <div class="url-row">
        <div class="url" id="url" title="">—</div>
        <button class="icon-btn" id="copyBtn" title="Скопировать ссылку">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h4"/></svg>
        </button>
      </div>
      <ol class="steps">
        <li>Открой камеру на телефоне</li>
        <li>Наведи на QR-код</li>
        <li>Кидай файлы в обе стороны</li>
      </ol>
      <div class="net-note" id="netNote" hidden>
        Не вижу сеть — проверь, что Wi-Fi включён
      </div>
      <div class="privacy">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9.5 12l1.8 1.8 3.4-3.6"/></svg>
        Всё идёт напрямую по Wi-Fi. Без облака и аккаунтов.
      </div>
    </aside>

    <section class="panel main-panel">
      <div class="dropzone" id="dropzone">
        <div class="dz-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
        </div>
        <div class="dz-text">
          <b>Перетащи файлы сюда</b>
          <span>они появятся на телефоне</span>
        </div>
        <button class="primary" id="pickBtn">Выбрать файлы</button>
        <input type="file" id="fileInput" multiple hidden>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="received">Принято <i id="cReceived">0</i></button>
        <button class="tab" data-tab="shared">Раздаю <i id="cShared">0</i></button>
        <button class="tab" data-tab="texts">Текст <i id="cTexts">0</i></button>
        <button class="tab-clear" id="clearBtn" hidden>Очистить</button>
      </div>

      <div class="tab-body" id="tabBody">
        <div class="list" id="receivedList"></div>
        <div class="list" id="sharedList" hidden></div>
        <div class="texts-pane" id="textsPane" hidden>
          <div class="messages" id="messages"></div>
          <div class="composer">
            <textarea id="textInput" placeholder="Ссылка или текст на телефон…" rows="2"></textarea>
            <button class="primary" id="sendBtn">Отправить</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
