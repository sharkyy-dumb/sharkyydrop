<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF5F3">
<title>Sharkyydrop</title>
<style>
  :root{
    --bg:#EDF5F3; --card:#FBFDFC; --card2:#F1F8F6;
    --surface:#FCFEFD; --surface-2:#F4FAF8;
    --line:#D9E7E4; --line2:#C4D9D5;
    --text:#102A2A; --text-soft:#45615F; --muted:#6E8987; --faint:#93ACA9;
    --accent:#0B7A75; --accent-dark:#075E5A; --accent-soft:#DDF2EF; --accent-line:#B9E3DD;
    --ok:#3E8F68; --input:#FFFFFF;
    --chip-bg:#E3F0EE; --chip-text:#5C7B78;
    --avatar-bg:#E7F3F0; --btn-bg:#EEF7F5;
    --toast-bg:#0E2525; --toast-text:#EAF6F4;
    --glow1:rgba(11,122,117,.11); --glow2:rgba(11,122,117,.07);
    --on-accent:#FFF9F4;
    --shadow:0 1px 2px rgba(16,42,42,.04),0 10px 24px rgba(16,42,42,.045);
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  html[data-theme="dark"]{
    --bg:#0B1B1D; --card:#122628; --card2:#163033;
    --surface:#142B2D; --surface-2:#193436;
    --line:#244447; --line2:#315A5C;
    --text:#EAF5F3; --text-soft:#C4DAD7; --muted:#8FADAA; --faint:#6F8D8A;
    --accent:#34BDB3; --accent-dark:#5BD3C9; --accent-soft:rgba(52,189,179,.16); --accent-line:rgba(52,189,179,.32);
    --ok:#5FBF8B; --input:#163033;
    --chip-bg:#1B3739; --chip-text:#9CB8B5;
    --avatar-bg:#1B3739; --btn-bg:#193436;
    --toast-bg:#EAF5F3; --toast-text:#0B1B1D;
    --glow1:rgba(52,189,179,.10); --glow2:rgba(52,189,179,.06);
    --on-accent:#04201F;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:
      radial-gradient(760px 460px at 95% -8%,var(--glow1),transparent 60%),
      radial-gradient(620px 440px at -10% 8%,var(--glow2),transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    padding:18px 16px 40px;
    transition:background-color .2s,color .2s;
  }
  .wrap{max-width:520px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin:6px 2px 20px}
  .mark{
    width:44px;height:44px;border-radius:13px;overflow:hidden;
    display:grid;place-items:center;flex:0 0 auto;
    box-shadow:0 4px 14px rgba(7,111,106,.30);
  }
  .mark svg{width:100%;height:100%;display:block}
  h1{font-family:var(--serif);font-size:21px;font-weight:600;color:var(--text);margin:0;letter-spacing:-.4px;white-space:nowrap}
  .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
  .head-actions{margin-left:auto;display:flex;align-items:center;gap:12px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);
    box-shadow:0 0 0 4px rgba(62,143,104,.14)}
  .dot.off{background:#C4553B;box-shadow:0 0 0 4px rgba(196,85,59,.13)}
  .theme-btn{
    width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);
    background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;
    transition:.15s;
  }
  .theme-btn:active{transform:scale(.96)}
  .theme-btn svg{width:17px;height:17px;stroke:currentColor;fill:none}
  .theme-btn .i-sun{display:none}
  html[data-theme="dark"] .theme-btn .i-sun{display:block}
  html[data-theme="dark"] .theme-btn .i-moon{display:none}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow);
    transition:background-color .2s,border-color .2s;
  }
  .drop{
    border:1.5px dashed var(--line2);border-radius:14px;padding:26px 16px;text-align:center;
    transition:.2s;background:var(--surface-2);cursor:pointer;
  }
  .drop:active,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
  .drop .ico{
    width:56px;height:56px;border-radius:15px;margin:0 auto 12px;
    display:grid;place-items:center;background:var(--accent-soft);
  }
  .drop .ico svg{width:28px;height:28px;stroke:var(--accent-dark)}
  .drop b{display:block;font-size:16px;font-weight:600;margin-bottom:4px}
  .drop span{font-size:13px;color:var(--muted)}
  .row{display:flex;gap:10px;margin-top:12px}
  .btn{
    flex:1;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;font-weight:600;
    background:var(--btn-bg);color:var(--text-soft);display:inline-flex;align-items:center;
    justify-content:center;gap:8px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .btn:active{transform:scale(.99)}
  .btn svg{width:18px;height:18px;stroke:currentColor}
  .btn.primary{
    background:var(--accent);color:var(--on-accent);border-color:transparent;
    box-shadow:0 2px 8px rgba(11,122,117,.24);
  }
  .btn.primary:active{background:var(--accent-dark)}
  .btn:disabled{opacity:.5}
  .progress{height:8px;border-radius:99px;background:var(--chip-bg);overflow:hidden;margin-top:14px;display:none}
  .progress.on{display:block}
  .progress > i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .pnote{font-size:12px;color:var(--muted);margin-top:8px;display:none}
  .pnote.on{display:block}
  h2{
    font-family:var(--serif);font-size:16.5px;font-weight:600;color:var(--text);
    margin:0 2px 10px;letter-spacing:-.1px;
  }
  .list{display:flex;flex-direction:column;gap:8px}
  .item{
    display:flex;align-items:center;gap:12px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:11px 12px;text-decoration:none;color:inherit;
    transition:background-color .2s,border-color .2s;
  }
  .avatar{
    width:40px;height:40px;border-radius:11px;background:var(--avatar-bg);display:grid;place-items:center;
    flex:0 0 auto;font-size:11px;font-weight:700;color:var(--accent-dark);text-transform:uppercase;
  }
  .meta{min-width:0;flex:1}
  .name{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:550}
  .size{font-size:12px;color:var(--muted);margin-top:2px}
  .dl{width:34px;height:34px;border-radius:9px;background:var(--accent-soft);
    display:grid;place-items:center;flex:0 0 auto}
  .dl svg{width:17px;height:17px;stroke:var(--accent-dark)}
  .empty{color:var(--faint);font-size:13px;text-align:center;padding:14px;border:1px dashed var(--line2);border-radius:12px}
  textarea{
    width:100%;resize:vertical;min-height:74px;background:var(--input);color:var(--text);
    border:1px solid var(--line2);border-radius:12px;padding:12px;font:inherit;font-size:14px;outline:none;
    transition:.15s;
  }
  textarea::placeholder{color:var(--faint)}
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,122,117,.15)}
  .texts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .msg{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:10px 40px 10px 12px;font-size:14px;line-height:1.5;word-break:break-word;
    transition:background-color .2s,border-color .2s}
  .msg .who{font-size:11px;color:var(--faint);margin-bottom:4px;display:block}
  .msg .body{white-space:pre-wrap}
  .msg a{color:var(--accent-dark);word-break:break-all}
  .copy-msg{
    position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:7px;border:0;
    background:transparent;color:var(--faint);display:grid;place-items:center;cursor:pointer;
    opacity:.6;transition:.15s;
  }
  .copy-msg:active{opacity:1;background:var(--card2);color:var(--accent-dark)}
  .copy-msg svg{width:15px;height:15px;stroke:currentColor;fill:none}
  .toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;
    background:var(--toast-bg);color:var(--toast-text);border:1px solid var(--line2);border-radius:11px;
    padding:11px 16px;font-size:13px;transition:.25s;pointer-events:none;max-width:90vw;
    text-align:center;z-index:9;box-shadow:0 16px 36px rgba(0,0,0,.26);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  footer{text-align:center;color:var(--faint);font-size:12px;margin-top:18px}
  input[type=file]{display:none}
</style>
<script>
try {
  var initialTheme = localStorage.getItem("sharkyydrop-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = initialTheme;
  document.querySelector('meta[name="theme-color"]').setAttribute("content", initialTheme === "dark" ? "#0B1B1D" : "#EDF5F3");
} catch (e) {
  document.documentElement.dataset.theme = "light";
}
</script>

<script>
const token = (location.pathname.split("/").filter(Boolean)[1] || "");
const base = "/t/" + encodeURIComponent(token);
const $ = (id) => document.getElementById(id);

function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove("on"), 2600);
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function size(n){
  if (!n || n < 0) return "0 Б";
  const u = ["Б","КБ","МБ","ГБ"];
  let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1){ v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(v < 10 ? 1 : 0)) + " " + u[i];
}

function ext(name){
  const p = name.split(".");
  if (p.length < 2) return "file";
  return p.pop().slice(0,3);
}

function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}

function applyTheme(theme){
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem("sharkyydrop-theme", theme); } catch (e) {}
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", theme === "dark" ? "#0B1B1D" : "#EDF5F3");
}

function toggleTheme(){
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
}

async function copyText(text){
  try {
    if (navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      toast("Скопировано");
      return;
    }
  } catch (e) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "-1000px";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, 99999);
    document.execCommand("copy");
    ta.remove();
    toast("Скопировано");
  } catch (e) {
    toast("Не удалось скопировать");
  }
}

let uploading = false;

function upload(list){
  if (!list || !list.length || uploading) return;
  uploading = true;
  const fd = new FormData();
  for (const f of list) fd.append("files", f, f.name);
  const xhr = new XMLHttpRequest();
  xhr.open("POST", base + "/upload");
  $("prog").classList.add("on");
  $("pnote").classList.add("on");
  $("pnote").textContent = "Отправляю " + (list.length > 1 ? list.length + " файлов…" : list[0].name);
  $("bar").style.width = "0%";
  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) $("bar").style.width = Math.round(e.loaded / e.total * 100) + "%";
  };
  xhr.onload = () => {
    uploading = false;
    $("prog").classList.remove("on");
    $("pnote").classList.remove("on");
    $("bar").style.width = "0%";
    if (xhr.status === 200){
      toast("Готово — файлы на компьютере");
      loadFiles();
    } else {
      toast("Не получилось: " + (xhr.responseText || xhr.status));
    }
  };
  xhr.onerror = () => {
    uploading = false;
    $("prog").classList.remove("on");
    $("pnote").classList.remove("on");
    toast("Нет связи с компьютером");
  };
  xhr.send(fd);
}

let lastFiles = "";
async function loadFiles(){
  try {
    const r = await fetch(base + "/files", {cache: "no-store"});
    if (!r.ok) throw new Error();
    const list = await r.json();
    $("dot").classList.remove("off");
    const key = JSON.stringify(list.map(f => f.id));
    if (key === lastFiles) return;
    lastFiles = key;
    if (!list.length){
      $("files").innerHTML = '<div class="empty">Пока пусто — кинь файл в окно на компьютере</div>';
      return;
    }
    $("files").innerHTML = list.slice().reverse().map(f => `
      <a class="item" href="${base}/files/${f.id}" download>
        <div class="avatar">${esc(ext(f.name))}</div>
        <div class="meta"><div class="name">${esc(f.name)}</div><div class="size">${size(f.size)}</div></div>
        <div class="dl"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0-4.5-4.5M12 16l4.5-4.5"/><path d="M4 19h16"/></svg></div>
      </a>`).join("");
  } catch (e){
    $("dot").classList.add("off");
  }
}

let lastTexts = "";
let textsData = [];
async function loadTexts(){
  try {
    const r = await fetch(base + "/text", {cache: "no-store"});
    if (!r.ok) throw new Error();
    const list = await r.json();
    textsData = list;
    const key = JSON.stringify(list.map(t => t.at + t.text));
    if (key === lastTexts) return;
    lastTexts = key;
    if (!list.length){ $("texts").innerHTML = ""; return; }
    $("texts").innerHTML = list.map((t, i) => ({t, i})).reverse().map(({t, i}) =>
      `<div class="msg"><button class="copy-msg" data-copy="${i}" title="Скопировать текст" aria-label="Скопировать текст"><svg viewBox="0 0 24 24" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h4"/></svg></button><span class="who">${t.from === "pc" ? "с компьютера" : "с телефона"}</span><span class="body">${linkify(t.text)}</span></div>`
    ).join("");
  } catch (e){}
}

async function sendText(){
  const value = $("text").value.trim();
  if (!value) return;
  $("sendText").disabled = true;
  try {
    const r = await fetch(base + "/text", {method: "POST", headers: {"Content-Type": "text/plain"}, body: value});
    if (!r.ok) throw new Error();
    $("text").value = "";
    toast("Отправлено на компьютер");
    lastTexts = "";
    loadTexts();
  } catch (e){
    toast("Не получилось отправить");
  } finally {
    $("sendText").disabled = false;
  }
}

$("pick").onclick = () => $("fileInput").click();
$("photo").onclick = () => $("photoInput").click();
$("fileInput").onchange = (e) => { upload(e.target.files); e.target.value = ""; };
$("photoInput").onchange = (e) => { upload(e.target.files); e.target.value = ""; };
$("sendText").onclick = sendText;
$("themeBtn").addEventListener("click", toggleTheme);
$("text").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") sendText();
});
$("texts").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-copy]");
  if (!btn) return;
  const item = textsData[Number(btn.dataset.copy)];
  if (item) copyText(item.text);
});

const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  upload(e.dataTransfer.files);
});

loadFiles();
loadTexts();
setInterval(() => { if (!document.hidden){ loadFiles(); loadTexts(); } }, 2500);
</script>
</body>
</html>
