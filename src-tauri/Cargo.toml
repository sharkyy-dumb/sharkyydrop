[package]
name = "sharkyydrop"
version = "0.1.0"
description = "AirDrop for everyone: move files and links between your computer and phone over Wi-Fi"
authors = ["sharkyy"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sharkyydrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
qrcode = "0.14"
dirs = "6"
open = "5"
mime_guess = "2"
fastrand = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
